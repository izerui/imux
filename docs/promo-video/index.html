<style>

  .cap.light { color: #fff6e6; text-shadow: 0 4px 28px #0007; }

  .ch { display: inline-block; }

  /* 内景：暖灯照着的墙 */
  .ground { position: absolute; inset: 0; background:

  .ground.teal::before { display: none; }

  /* 终端纸片 */
  .paper { position: absolute; left: 0; top: 0; width: 300px; height: 190px; box-sizing: border-box; background: #1e1f22; border: 3px solid #fff3df; border-radius: 12px; box-shadow: 0 18px 40px #3a1a0866; overflow: hidden; font-family: Menlo, monospace; color: #9a9da3; font-size: 15px; }

  const N = 260, pts = [];
  for (let i = 0; i <= N; i++) {
    const s = i / N;
    const tx = 560 + 230 * Math.sin(2 * Math.PI * 3.1 * s) + 95 * Math.sin(2 * Math.PI * 7.3 * s + 1) + 60 * Math.sin(2 * Math.PI * 1.3 * s);

    const sx = trailAxis.x, sy = trailAxis.y0 + s * (trailAxis.y1 - trailAxis.y0);
    let q = Math.min(1, Math.max(0, k * 1.6 - (1 - s) * .6));
    q = q * q * (3 - 2 * q);
    pts.push(`${(tx + (sx - tx) * q).toFixed(1)},${(ty + (sy - ty) * q).toFixed(1)}`);
  }
  scribble.setAttribute('d', 'M' + pts.join(' L'));
}
