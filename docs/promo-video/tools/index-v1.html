<style>

<script>
const V = OM.vars();
const B = 2.4125, BEAT = B / 4, bar = (n) => n * B;
const END = 60.5;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const rnd = OM.random(20261106);
const NS = 'http://www.w3.org/2000/svg';
const svgEl = (g, tag, a) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); g.appendChild(e); return e; };
const chars = (el, s) => { el.innerHTML = [...s].map((c) => `<span class="ch">${c}</span>`).join(''); return $$('.ch', el); };
function paper(title, lines = 3) {
  const d = document.createElement('div');
  d.className = 'paper';
  d.innerHTML = `<div class="bar"><i></i><i></i><i></i><b>${title}</b></div>` +
    Array.from({ length: lines }, (_, k) => `<div class="l ${k ? '' : 'b'}" style="width:${40 + rnd() * 50}%"></div>`).join('');
  return d;
}

// ───────── 小城 ─────────
const town = $('#town');
town.innerHTML = `<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#15343a"/><stop offset=".55" stop-color="#3f6763"/><stop offset=".82" stop-color="#d48a4c"/><stop offset="1" stop-color="#f2b56b"/></linearGradient>
  <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#081417"/><stop offset=".7" stop-color="#10272b"/><stop offset="1" stop-color="#2b3f3c"/></linearGradient>
  <filter id="brush"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="3" seed="7"/><feDisplacementMap in="SourceGraphic" scale="9"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter></defs>
  <rect x="-400" y="-300" width="3200" height="1700" fill="url(#sky)"/>
  <rect id="nightSky" x="-400" y="-300" width="3200" height="1700" fill="url(#night)" opacity="0"/>
  <circle id="sun" cx="520" cy="880" r="190" fill="#ffd39a" opacity=".6" filter="url(#soft)"/>
  <g id="stars" fill="#fff6e6" opacity="0"></g>
  <g class="streaks" id="extWind"></g>
  <g id="far" filter="url(#brush)" fill="#4e6f69"></g>
  <g id="mid" filter="url(#brush)" fill="#2c4645"></g>
  <g id="near" filter="url(#brush)" fill="#1a2829"></g>`;
for (let i = 0; i < 70; i++) svgEl($('#stars'), 'circle', { cx: -300 + rnd() * 2900, cy: -250 + rnd() * 700, r: .8 + rnd() * 1.8 });
const offWins = [];
function houses(id, y0, hMin, hMax, wMin, wMax, lit) {
  const g = document.getElementById(id);
  for (let x = -420; x < 2700;) {
    const w = wMin + rnd() * (wMax - wMin), h = hMin + rnd() * (hMax - hMin), top = y0 - h;
    svgEl(g, 'rect', { x, y: top, width: w, height: 1400 - top });
    if (rnd() < .55) svgEl(g, 'polygon', { points: `${x - 6},${top} ${x + w / 2},${top - w * .45} ${x + w + 6},${top}` });
    if (rnd() < .3) svgEl(g, 'rect', { x: x + w * .7, y: top - w * .5, width: w * .12, height: w * .4 });
    for (let wy = top + 18; wy < 1100; wy += 30) for (let wx = x + 12; wx < x + w - 16; wx += 22) {
      const on = rnd() < lit;
      const r = svgEl(g, 'rect', { x: wx, y: wy, width: 8, height: 12, fill: rnd() < .7 ? '#e5c07b' : '#f0a060', opacity: on ? .55 + rnd() * .45 : 0 });
      if (!on && rnd() < .55) offWins.push(r);
    }
    x += w + rnd() * 10;
  }
}
houses('far', 880, 40, 170, 60, 130, .16);
houses('mid', 975, 50, 190, 100, 180, .12);
houses('near', 1075, 30, 110, 150, 280, .05);
offWins.sort((a, b) => a.getAttribute('x') - b.getAttribute('x'));
// 风线：pathLength=1，用 dashoffset 让它一直往右流
function windLines(g, n, y0, y1, seed) {
  const r = OM.random(seed), out = [];
  for (let i = 0; i < n; i++) {
    const y = y0 + (y1 - y0) * i / n + r() * 40, x0 = -300 + r() * 200, amp = 40 + r() * 70;
    out.push(svgEl(g, 'path', { d: `M${x0},${y} C${x0 + 500},${y - amp} ${x0 + 900},${y + amp} ${x0 + 1400},${y - 10} S${x0 + 1900},${y - amp} ${x0 + 2400},${y + 20}`,
      'stroke-width': 2 + r() * 5, opacity: .16 + r() * .32, pathLength: 1, 'stroke-dasharray': `${.25 + r() * .2} 1`, 'stroke-dashoffset': r() }));
  }
  return out;
}
const extWind = windLines($('#extWind'), 10, 120, 700, 3);

// 开场纸片
const hookPapers = [];
const titles = ['claude · 登录接口限流', 'claude · 首页改版', 'codex · 审查并发', 'claude · 重构扫描', 'pi · 发布脚本', 'codex · 分段测试', 'claude · 路径大小写', 'claude · Gradle'];
for (let i = 0; i < 16; i++) {
  const p = paper(titles[i % titles.length]);
  $('#hookPapers').appendChild(p);
  hookPapers.push({ el: p, x: 140 + rnd() * 860, y: 440 + rnd() * 300, r: -30 + rnd() * 60, s: .55 + rnd() * .3 });
}

// ───────── 界面 ─────────
$('#s1panel').innerHTML = UI.panel('', { tail: 40 });
$('#s2dlg').innerHTML = UI.clarify();
$('#s3term').innerHTML = UI.term('', { w: 1640, banner: false, bar: false, top: 36, lines: [
  ['q', '❯ 把 getUser 改名为 fetchUser，再查查限流为什么没生效'],
  ['w', '好的。改名用 IDE 的语义重命名，排查直接下断点。'],
  ['t', '<span style="color:#e5c07b">idea · rename_refactoring</span> (MCP)(getUser → fetchUser)'],
  ['s', '⎿ <span class="ok">已重命名 23 处引用 · 6 个文件</span> · 同名的 UserCache.getUser 未受影响'],
  ['t', '<span style="color:#e5c07b">idea · xdebug_set_breakpoint</span> (MCP)(RateLimiter.kt:42)'],
  ['s', '⎿ 命中断点 · count = 11 · limit = 10 · <span class="warn">时间窗过期后没有清零</span>'],
  ['w', '找到了：时间窗过期后计数没重置，正在修。'],
] });
$('#s4term').innerHTML = UI.term('', { w: 1800, top: 110, lines: [
  ['q', '❯ 给登录接口加上按 IP 的限流，每分钟 10 次'],
  ['w', '我先看一下登录接口和现有的过滤器。'],
  ['t', 'Write(src/main/kotlin/auth/RateLimiter.kt)'],
  ['s', '⎿ Wrote 64 lines'],
  ['t', 'Bash(./gradlew test --tests "*Login*")'],
  ['s', '⎿ <span class="ok">BUILD SUCCESSFUL in 12s · 14 tests passed</span>'],
  ['w', '已完成：登录接口按 IP 限流，每分钟 10 次，超出返回 429。'],
  ['q', '❯ <span style="color:#e5c07b">[Codex 审查]</span> 计数在并发下不是原子的，两个请求可能同时通过'],
  ['w', '收到，改用 AtomicInteger，并补一个并发测试。'],
] });
$('#s5term').innerHTML = UI.term('', { banner: '<span style="font-size:26px;color:#548af7">ⓘ</span>已预约审查（Codex）：本轮结束后开始', bar: 'pair', barState: 'pair', top: 120, lines: [
  ['t', 'Read(src/main/kotlin/auth/LoginController.kt)'],
  ['s', '⎿ Read 186 lines'],
  ['t', 'Write(src/main/kotlin/auth/RateLimiter.kt)'],
  ['s', '⎿ Wrote 64 lines'],
  ['w', '好的，先预约一次副驾驶审查，这一轮做完后自动开始。'],
  ['t', 'imux_session - review_once (MCP)(instruction: "重点看并发")'],
  ['s', '⎿ {"outcome": "scheduled", "partner": "codex"}'],
] });
$('#s6card').innerHTML = UI.trail();

const T7 = bar(16);
tl.addLabel('scene:phone', T7);
tl.set('#s6', { autoAlpha: 1 }, T7).set('#ext', { autoAlpha: 1 }, T7);
scenes.filter((s) => s !== '#s6' && s !== '#ext').forEach((s) => tl.set(s, { autoAlpha: 0 }, T7));
tl.set('#s6', { zIndex: 3 }, T7).set('#s6', { zIndex: 0 }, 0);
tl.fromTo('#s6', { scale: 1, x: 0, y: 0 }, { scale: .3, x: WIN.x - 960, y: WIN.y - 540, duration: .8, ease: 'power3.inOut', immediateRender: false }, T7)
  .to('#s6', { autoAlpha: 0, duration: .25 }, T7 + .6);
tl.set('#s6', { scale: 1, x: 0, y: 0 }, T7 + 1);
tl.fromTo('#extCam', { scale: PUSH }, { scale: 1, duration: .8, ease: 'power3.inOut', immediateRender: false }, T7);
tl.set(['#far', '#mid', '#near'], { x: 0 }, T7).set(hookPapers.map((p) => p.el), { opacity: 0 }, T7).set('#hookCap', { opacity: 0 }, T7);
tl.fromTo('#nightSky', { opacity: 0 }, { opacity: .55, duration: .01, immediateRender: false }, T7);
tl.fromTo('#plane', { x: WIN.x - 60, y: WIN.y - 40, rotation: -10, scale: .4, opacity: 0 },
  { keyframes: [{ opacity: 1, scale: .9, x: WIN.x + 120, y: WIN.y - 160, duration: .5 }, { x: WIN.x + 700, y: WIN.y - 420, rotation: -22, scale: 1.3, duration: 1.1, ease: 'sine.in' }], immediateRender: false }, T7 + .75);
tl.fromTo('#extCam', { x: 0, y: 0 }, { x: -320, y: 160, duration: 1.6, ease: 'sine.inOut', immediateRender: false }, T7 + .8);
const T7b = bar(17);
show('#sea', T7b);
{ const pl = $('#plane').cloneNode(true); pl.id = 'plane2'; $('#sea').appendChild(pl); gsap.set(pl, { opacity: 0 }); tl.set(pl, { opacity: 0 }, 0);
  tl.fromTo(pl, { x: -150, y: 260, rotation: -14, scale: 1.4, opacity: 1 }, { keyframes: [{ x: 700, y: 140, rotation: 4, scale: 1.1, duration: .7 }, { x: 1400, y: 260, rotation: 22, scale: .4, opacity: 0, duration: .6 }], ease: 'sine.inOut', immediateRender: false }, T7b - .1); }
tl.fromTo(['#sea > svg', '#sea > .cap'], { y: 520 }, { y: 0, duration: 1.1, ease: 'power2.inOut', immediateRender: false }, T7b);
tl.fromTo('#seaPhone', { y: 420, rotation: 6 }, { y: 0, rotation: 0, duration: .8, ease: OM.spring(.14) }, T7b);
const phoneBits = $$('#seaPhone .me, #seaPhone .who, #seaPhone .card');
gsap.set(phoneBits, { opacity: 0 }); tl.set(phoneBits, { opacity: 0 }, 0);
phoneBits.forEach((b, i) => tl.fromTo(b, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: .35, immediateRender: false }, T7b + .6 + i * BEAT));
$$('#waves path').forEach((w, i) => tl.fromTo(w, { x: 0 }, { x: (i % 2 ? 1 : -1) * (30 + i * 2), duration: B * 2, ease: 'sine.inOut', immediateRender: false }, T7b));
tl.fromTo('#sea .cap', { opacity: 0, y: 30 }, { opacity: (i) => i ? .85 : 1, y: 0, duration: .5, stagger: .3 }, T7b + .3);
tl.fromTo('#seaCam', { x: 0, scale: 1 }, { x: -60, scale: 1.06, transformOrigin: '1400px 600px', duration: B * 2, ease: 'sine.inOut' }, T7b + .8);

// 8 直接对会话说：一拍一切
const T8 = bar(19);
tl.addLabel('scene:talk', T8);
show('#s8', T8);
const tks = $$('#s8beats .tk');
tks.forEach((tk, i) => {
  const at = T8 + i * 2 * BEAT;
  tl.set(tks, { visibility: 'hidden' }, at).set(tk, { visibility: 'visible' }, at);
  tl.set('#s8g', { attr: { class: talks[i][2] ? 'ground teal' : 'ground' } }, at)
    .set('#s8cap', { color: talks[i][2] ? '#fff6e6' : '#2a1a10' }, at);
  tl.fromTo(tk.querySelector('.tq'), { x: i % 2 ? 700 : -700, rotation: i % 2 ? 6 : -6, opacity: 0 }, { x: 0, rotation: 0, opacity: 1, duration: .38, ease: 'expo.out', immediateRender: false }, at)
    .fromTo(tk.querySelector('.ta'), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: .3, immediateRender: false }, at + BEAT * .9);
});
tl.set(tks, { visibility: 'hidden' }, 0);

// 9 结尾：全城点灯
const T9 = bar(21);
tl.addLabel('scene:end', T9);
show('#ext', T9);
tl.set(['#bigWin', '#sill'], { opacity: 0 }, T9).set(['#bigWin', '#sill'], { opacity: 1 }, 0)
  .set('#nightSky', { opacity: .92 }, T9).set('#sun', { opacity: 0 }, T9).set('#stars', { opacity: .8 }, T9).set('#plane', { opacity: 0 }, T9)
  .set('#sun', { opacity: .6 }, 0).set('#stars', { opacity: 0 }, 0).set('#nightSky', { opacity: 0 }, 0);
tl.fromTo('#extCam', { scale: 1.6, x: 0, y: 0, transformOrigin: '960px 760px' }, { scale: 1, duration: 2.4, ease: 'power2.inOut', immediateRender: false }, T9);
tl.set('#extCam', { transformOrigin: `${WIN.x}px ${WIN.y}px` }, 0);
tl.fromTo(offWins, { attr: { opacity: 0 } }, { attr: { opacity: .95 }, duration: .25, stagger: { each: 3.2 / offWins.length }, ease: 'none', immediateRender: false }, T9 + .3);
tl.fromTo('#endCard', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: .9 }, T9 + .6);
tl.fromTo('#install', { opacity: 0 }, { opacity: .9, duration: .6 }, T9 + 1.8);
tl.fromTo('#plane', { x: -200, y: 640, rotation: -12, scale: .7, opacity: 1 }, { keyframes: [{ x: 700, y: 520, rotation: -6, duration: 2.2 }, { x: 1500, y: 600, rotation: 8, duration: 2 }, { x: 2200, y: 430, rotation: -18, duration: 1.6 }], ease: 'sine.inOut', immediateRender: false }, T9 + 2.4);
tl.set('#endCard', { opacity: 0 }, 0);
tl.to('#film', { opacity: 0, duration: .9, ease: 'power1.in' }, END - .9).set('#film', { opacity: 1 }, 0);
tl.to({}, { duration: END - tl.duration() > 0 ? END - tl.duration() : 0 });

window.__timelines = window.__timelines || {};
window.__timelines['imux-promo'] = tl;
</script>
