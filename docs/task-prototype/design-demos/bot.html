<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>imux · 从手机到工程</title><link rel="stylesheet" href="bot.css"><body><header><div><b>imux</b><span>开发助手 · 交互原型 v2</span></div><div class="top"><span class="tag">全部模拟，不执行代码</span><button id="reset">重置演示</button></div></header><section class="lead"><div><h1>交代事情，不用先找会话。</h1><p>左边是手机，右边是电脑上的控制中心。操作任一侧，两边同步变化。</p></div><label>演示环境<select id="environment"><option value="ready">控制中心在线 · 工程已打开</option><option value="closed">控制中心在线 · 所有工程关闭</option><option value="offline">控制中心不可用</option></select></label></section><main><section class="phone"><div class="phonebar"><span>09:41</span><span>手机聊天模拟</span></div><div class="chathead"><b>imux 助手</b><span id="connection"></span></div><div class="focus" id="focus"></div><div class="messages" id="messages" aria-live="polite"></div><div class="phoneactions" id="phoneactions"></div><form id="send"><label class="sr" for="text">给助手发消息</label><input id="text" placeholder="输入需求，或点击上方示例"><button class="primary">发送</button></form><small class="disclaimer">预设流程模拟，不连接微信、不调用模型</small></section><section class="desktop"><div class="window"><span>● ● ●</span><b>imux 控制中心</b><span class="muted">本机部署假设 · 尚未定案</span></div><div class="desktopbody"><aside><button data-view="tasks" class="nav active">任务</button><button data-view="projects" class="nav">工程与执行端</button><button data-view="channels" class="nav">手机与权限</button><div class="help">一个稳定入口<br>多个工程窗口<br>按任务创建会话</div></aside><section class="content"><div id="workspace"></div></section></div><footer id="footer"></footer></section></main><section class="simulation"><div><b>演示执行事件</b><p>这些按钮代替真实 CLI 上报，正式产品没有这一排。</p></div><div id="events"></div></section><p id="notice" role="status"></p><dialog id="modal" aria-labelledby="dialogtitle"><h2 id="dialogtitle"></h2><div id="dialogcontent"></div><div class="buttons"><button id="dismiss" autofocus>取消</button><button id="accept" class="primary">确认</button></div></dialog><script src="bot.js"></script></body></html>
