<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>imux · 任务交互实验室</title><link rel="stylesheet" href="prototype.css">
<body><header class="lab"><div><strong>imux 交互实验室</strong><span>仅演示 · 不执行命令、不连接模型、不修改工程</span></div><nav aria-label="交互方向"><a href="?mode=session">A 会话为主</a><a href="?mode=task">B 任务与会话</a><a href="?mode=team">C 委派协作</a></nav><button id="reset">重新体验</button></header>
<section class="intro"><div><span id="eyebrow"></span><h1 id="heading"></h1><p id="description"></p></div><div class="guide"><strong>建议体验路径</strong><p id="path"></p></div></section>
<main class="ide"><header class="titlebar"><span class="windowdots">● ● ●</span><strong>imux</strong><span>main</span><span class="muted">工程窗口 / 交互概念稿</span></header><div class="workspace"><aside class="sidebar"><div class="sidehead"><strong>AI 智能体</strong><button id="create">＋ 新任务</button></div><div class="switch"><button id="tasks">任务</button><button id="sessions">会话</button></div><div id="list"></div><div class="sidefoot">本地演示数据<br>刷新页面即重置</div></aside><section class="editor"><div class="tabs"><span class="muted">README.md</span><span id="sessiontab"></span></div><div id="progress"></div><div class="conversation" id="conversation" aria-live="polite"></div><div class="composer"><label for="message">继续与当前会话交流</label><form id="chat"><textarea id="message" rows="2" placeholder="试试：再补一个异常场景（这里只模拟记录，不理解或执行指令）"></textarea><button class="primary">发送</button></form><small>这里仍是会话入口。任务状态来自下方演示按钮，不伪装成真实 AI。</small></div></section><aside class="inspector" id="inspector"></aside></div><footer class="statusbar"><span id="bottom"></span><span>所有运行、改动与测试结果均为模拟</span></footer></main>
<section class="sim"><div><strong>演示控制台</strong><p>代替真实执行事件，点击推进；不会自动消耗 Token。</p></div><div id="controls"></div></section><div id="notice" role="status"></div>
<dialog id="modal" aria-labelledby="modal-title"><h1 id="modal-title"></h1><div id="modal-body"></div><div class="dialogbuttons"><button id="cancel" autofocus>取消</button><button id="confirm" class="primary">确认</button></div></dialog><script src="prototype.js"></script></body></html>
