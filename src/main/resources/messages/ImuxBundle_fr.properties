bridge.reply.promptRejected=Rien n’a été fait : images et fichiers ne sont pas acceptés tant qu’un choix est ouvert, ou ce choix ne peut pas être fait depuis le téléphone. Veuillez le traiter dans l’IDE.
bridge.status.hookPermission=Votre approbation est requise :\n\n{0}\n\nRépondez "1" ou "allow" pour autoriser cette fois seulement, ou "deny" pour refuser. Vous pouvez aussi écrire ce que vous voulez à la place : Claude abandonne cette étape et change d’approche selon votre message. Les autorisations permanentes ne peuvent pas être accordées depuis le téléphone ; choisissez-les dans l’IDE si besoin.
bridge.status.hookQueued=Encore {0} confirmation(s) en attente ; la suivante arrive dès que vous répondez à celle-ci.
bridge.reply.hookWordsForwarded=Votre message a été pris comme réponse à la confirmation ci-dessus : « {0} » a été refusé et vos mots ont été transmis à Claude, qui va changer d’approche en conséquence. Pour demander autre chose, répondez d’abord à la confirmation par « 1 » ou « deny ».
bridge.reply.hookPlanRevising=Votre message a été pris comme une demande de modification du plan ci-dessus et transmis à Claude, qui va réviser le plan. Pour demander autre chose, répondez d’abord au plan par « 1 », « 2 » ou « no ».
bridge.reply.hookPlanChoose=Répondez "1" ou "2" pour choisir comment continuer, "no" pour ne pas continuer, ou dites simplement ce qu’il faut changer.
bridge.reply.hookAnswerFirst=Le message ci-dessus est une demande qui attend votre confirmation. Répondez-y d’abord ; ce que vous venez d’envoyer n’a pas été transmis à la session.
bridge.status.hookAllowedLocally=« {0} » a été autorisé dans l’IDE. Inutile de répondre à cette confirmation sur le téléphone.
