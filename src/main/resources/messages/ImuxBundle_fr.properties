settings.reply.plain.comment=S’applique aux sessions Claude, Codex et Pi ouvertes dans imux, indépendamment d’IDEA MCP. Prend effet à l’ouverture ou à la reprise d’une session. Les revues de programmation en binôme et autres appels en arrière-plan ne sont pas concernés. Codex le reçoit comme developer_instructions de la session, ce qui remplace une valeur de même clé dans sa configuration ; AGENTS.md n’est pas concerné.

