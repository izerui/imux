bridge.status.plan=Claude a rédigé un plan. Continuer avec ce plan ?\n\n{0}\n\nRépondez "1" pour continuer comme avec l’option 1 sur l’ordinateur (mode automatique ; les sessions lancées en contournant les permissions rétablissent le mode bypass permissions), ou "2" pour continuer en validant chaque modification. Répondez "no" pour ne pas continuer. Vous pouvez aussi dire ce qu’il faut changer : Claude révisera le plan.
bridge.status.question.single={0}\n\nRépondez par le numéro d’une option pour choisir ; pour un choix multiple, séparez-les par des espaces, comme "1 3". Vous pouvez aussi écrire simplement ce que vous voulez : vos mots serviront de réponse.
