handoff.prompt=Reprends la tâche de la session ci-dessous. Commence par utiliser les outils pour lire l''intégralité de l''enregistrement de la session source au chemin exact `{1}`, puis examine l''espace de travail actuel et évalue l''avancement. L''enregistrement indique ce qui a été dit et affirmé ; l''espace de travail montre ce qui existe réellement : en cas de désaccord, fie-toi à l''espace de travail. Rends compte de ce que l''utilisateur cherche à obtenir (révisions ultérieures comprises), du travail terminé et restant, de ce qui n''est pas encore bouclé côté flux métier ou logique, de tout point où l''objectif principal a été négligé ou détourné au profit de détails secondaires, ainsi que des modifications locales pertinentes, puis attends de nouvelles instructions. Les messages de l''enregistrement qui commencent par « [Copilot review » ou « 【副驾驶审查意见 » sont des remarques de revue émises par une autre IA travaillant en binôme, et non des demandes de l''utilisateur.\n\n{0}

