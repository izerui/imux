settings.code.tools.inject.comment=Les outils Imux file_outline, find_references, call_hierarchy et type_hierarchy appellent directement la vue Structure et le moteur « Rechercher les usages » de l’IDE ; ils fonctionnent pour tout langage que l’IDE comprend, avec ou sans IDEA MCP. Les relectures en programmation en binôme et les discussions « Parlons d’abord » en disposent aussi. Les bibliothèques standard et les dépendances tierces ne sont trouvées que si le SDK du projet est configuré dans l’IDE (interpréteur ou environnement virtuel Python, JDK, node_modules installés) ; sinon, les recherches qui passent par elles restent incomplètes.
